# Optional: a local Ollama with the embedding model bge-m3 baked in, for the company's knowledge without a cloud
# provider (README.md "Embeddings with a local Ollama"). The image is about 5 GB; once pulled, it needs no internet.
# Started after docker-compose.prod.yml, whose network it joins - the app reaches it as
# http://alpdesk-ai-embeddings:11434:
#
#   podman-compose -f docker-compose.embeddings.yml up -d
#
# Its own project name: the app's stack is not touched by an up or down of this file.
name: alpdesk-ai-embeddings

services:

  embeddings:
    image: ghcr.io/xprojects-de/alpdesk-ai-embeddings:latest
    container_name: alpdesk-ai-embeddings
    environment:
      # How long the model stays in memory after its last use (Ollama's default: 5m).
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
    # Ollama has neither TLS nor keys: no published port - only the containers of the app's network reach it.
    # Not root (the image's user), a read-only root - Ollama writes to /tmp only.
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    networks:
      - default
    restart: always

networks:
  # Created by docker-compose.prod.yml (project alpdesk-ai: the app, the database and Caddy).
  default:
    external: true
    name: alpdesk-ai_default
