# app settings
app.version=2.0.0
app.username=${APP_USERNAME\:alpdesk}
app.password=${APP_PASSWORD\:alpdesk}
# Sign-in through a WAM proxy (security.WamProxy, docs/architecture/tenancy.md): off unless set on purpose. On, tenant
# users sign in with the user name the proxy sends in user-header (and their name from name-header, if set) and have no
# password; the admin above keeps its password. The proxy must remove these headers from every request from outside,
# and the app must be reachable through the proxy only - the app trusts them completely.
app.wam.enabled=${APP_WAM_ENABLED\:false}
app.wam.user-header=${APP_WAM_USER_HEADER\:X-Remote-User}
app.wam.name-header=${APP_WAM_NAME_HEADER\:}
# The person's IDM groups, if the proxy sends them (empty: off): a user group with a WAM group counts for a member only
# while this header lists that IDM group - fail closed: a request without the header lists none, and while it is off
# such a group counts for nobody. Split at the separator, trimmed, compared without regard to case.
app.wam.groups-header=${APP_WAM_GROUPS_HEADER\:}
app.wam.groups-separator=${APP_WAM_GROUPS_SEPARATOR\:,}
micronaut.application.name=alpdesk-ai
# The time zone months are counted in (the usage per month) - the container itself runs in UTC.
app.timezone=Europe/Berlin
# AES-256 key (base64, 32 bytes) encrypting the AI providers' API keys in the database. The default is for local
# development only - the container sets APP_SECRET_KEY (`openssl rand -base64 32`). Losing or changing the key makes
# every stored API key unreadable: they must then be entered again.
app.secret-key=${APP_SECRET_KEY\:Pjux3Kv2gJTINYEmJmjFtWy/opbGEuVfOLXhEeija4Y=}
# 19100, not a port other projects commonly use: they can run side by side during development.
micronaut.server.port=19100
# JSON responses always carry every field - also empty maps/lists and nulls. Micronaut's default
# (NON_EMPTY) silently drops e.g. an empty "metadata": {}, so API clients (the frontend and the
# client software) could not rely on the documented shape.
micronaut.serde.serialization.inclusion=always
# CORS: the origins whose pages may call the API from the browser - the Angular dev server (4300, not Angular's
# usual 4200) by default; APP_CORS_ORIGINS (comma-separated, exact origins - never "*") for a frontend of the
# tenant's own on another origin (Backend/podman/public/README.md "A frontend of your own for the users"). The same
# origins may frame a handbook's website (DocSiteFilesController).
micronaut.server.cors.enabled=true
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4300}
micronaut.server.cors.configurations.ui.allowed-origins=${app.cors.origins}
micronaut.server.cors.configurations.ui.allowed-methods[0]=GET
micronaut.server.cors.configurations.ui.allowed-methods[1]=POST
micronaut.server.cors.configurations.ui.allowed-methods[2]=PUT
micronaut.server.cors.configurations.ui.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.ui.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.ui.allowed-methods[5]=PATCH
micronaut.server.cors.configurations.ui.allowed-headers[0]=Authorization
micronaut.server.cors.configurations.ui.allowed-headers[1]=Content-Type
micronaut.server.cors.configurations.ui.allowed-headers[2]=Accept
micronaut.server.cors.configurations.ui.allowed-headers[3]=X-Login-Key
# No credentials: the app authenticates with a bearer token, never a cookie. With them, a page of an allowed origin
# could have the browser send a WAM proxy's session cookie along and read the token POST /login/wam answers with.
micronaut.server.cors.configurations.ui.allow-credentials=false
# Static Resources (Frontend)
micronaut.router.static-resources.public.mapping=/**
micronaut.router.static-resources.public.paths=classpath\:public
# The web app manifest is JSON under a type of its own (BrandingController) - written by the JSON codec too.
micronaut.codec.json.additional-types[0]=application/manifest+json
# Uploads (multipart). A ZIP archive of documents (POST .../documents/archive) may have 512 MB, streamed into a
# temporary file; a single document, a chat file (50 MB each) and a logo are checked against their own limits before
# they are read (controller.document.DocumentUploads, ChatFiles, the logo upload). Parts above the threshold go to a
# temporary file instead of memory. The limits belong together - raise them together (Caddy has none of its own).
micronaut.server.max-request-size=512MB
micronaut.server.max-request-buffer-size=50MB
micronaut.server.multipart.max-file-size=512MB
micronaut.server.multipart.mixed=true
micronaut.server.multipart.threshold=1048576
# The handbook's ZIP (docs/architecture/doc-sites.md "Upload"): at most up to max-request-size and
# multipart.max-file-size above - raise them with it. Unpacked it may hold five times as much.
app.doc-site.max-zip-size=${APP_DOC_SITE_MAX_ZIP_SIZE\:100MB}
# security
# Micronaut's management endpoints (/health, /beans, /loggers, /flyway, ...) come in through a dependency and
# are not used - /watchdog is the liveness probe. Off, so nothing about the application is exposed.
endpoints.all.enabled=false
micronaut.security.endpoints.login.enabled=true
micronaut.security.endpoints.login.path=/login
micronaut.security.token.jwt.enabled=true
micronaut.security.authentication=bearer
# Only bearer tokens (admin JWT, tenant API keys). Micronaut's HTTP Basic login is on by default and
# would accept the admin credentials on every endpoint - not a supported way in.
micronaut.security.basic-auth.enabled=false
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET\:Erl0nIWS5qd226RZ0E0stgq47uWP1ddAfILRGwCTkMeZSSg0ZAFRBldEL09McKP8zy-bE5Mc9GhnhJ8rXaSzfA}
micronaut.security.token.generator.access-token.expiration=86400
micronaut.security.enabled=true
micronaut.security.reject-not-found=true
# swagger and static resources
micronaut.security.intercept-url-map[0].pattern=/
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/**/*.js
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/**/*.css
micronaut.security.intercept-url-map[2].access=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/**/*.html
micronaut.security.intercept-url-map[3].access=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/**/*.ico
micronaut.security.intercept-url-map[4].access=isAnonymous()
micronaut.security.intercept-url-map[5].pattern=/**/*.png
micronaut.security.intercept-url-map[5].access=isAnonymous()
micronaut.security.intercept-url-map[6].pattern=/**/*.jpg
micronaut.security.intercept-url-map[6].access=isAnonymous()
micronaut.security.intercept-url-map[7].pattern=/**/*.svg
micronaut.security.intercept-url-map[7].access=isAnonymous()
micronaut.security.intercept-url-map[8].pattern=/swagger/**
micronaut.security.intercept-url-map[8].access=isAnonymous()
micronaut.security.intercept-url-map[9].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[9].access=isAnonymous()
micronaut.security.intercept-url-map[10].pattern=/login
micronaut.security.intercept-url-map[10].access=isAnonymous()
micronaut.security.intercept-url-map[11].pattern=/**/*.woff
micronaut.security.intercept-url-map[11].access=isAnonymous()
micronaut.security.intercept-url-map[12].pattern=/**/*.woff2
micronaut.security.intercept-url-map[12].access=isAnonymous()
# The tenant's MCP server (Micronaut MCP's controller, which carries no @Secured): the MCP key only.
micronaut.security.intercept-url-map[13].pattern=/mcp
micronaut.security.intercept-url-map[13].access=ROLE_MCP
# The tenants' assistant as an A2A agent (docs/architecture/a2a.md): an MCP key that opens /a2a.
micronaut.security.intercept-url-map[14].pattern=/a2a
micronaut.security.intercept-url-map[14].access=ROLE_MCP
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath\:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger
# PostgreSQL: the management database (tenants, API keys). Every tenant's own database (embeddings, chat
# history) is created and reached separately - see docs/architecture/tenancy.md.
# No URL/credentials here on purpose:
# - Container/production: set DATASOURCES_DEFAULT_URL (jdbc:postgresql://host:5432/db),
#   DATASOURCES_DEFAULT_USERNAME and DATASOURCES_DEFAULT_PASSWORD. Without them startup fails
#   instead of silently talking to some default database.
# - `./gradlew run` / the IDE ("dev"): application-dev.properties, the database of podman/docker-compose.dev.yml.
# - The tests: a Testcontainers JDBC URL in application-test.properties.
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=10
# PostgreSQL's error messages would quote the failing row (personal data) - see GlobalExceptionHandler.
datasources.default.data-source-properties.logServerErrorDetail=false
# A writer waits at most 10s for another's lock, then fails with 503 "try again" - waiting without limit would hold a
# pool connection for as long as the other writer takes. A transaction the app left open without doing anything is
# ended after a minute, with its locks.
datasources.default.data-source-properties.options=-c lock_timeout=10s -c idle_in_transaction_session_timeout=60s
# flyway
flyway.datasources.default.enabled=true
# Bounds how long an outbound @Client call can block a thread, so an upstream that accepts the
# connection but never answers cannot hang a request thread indefinitely.
micronaut.http.client.connect-timeout=5s
micronaut.http.client.read-timeout=30s
# Where the chat's files (uploaded and generated) are stored. type=local stores them under local.path - in the
# container a volume (APP_STORAGE_PATH). Another backend (e.g. S3) is a further FileStorage implementation selected by
# this type. Back it up together with the database.
app.storage.type=local
app.storage.local.path=${APP_STORAGE_PATH\:data/storage}
# AI providers (services.ai.AiModels): how long one call may take (a long answer or a large batch of embeddings) - an
# answer that is not streamed (/api/v1/chat, the MCP server) arrives as a whole only at its end, after the model's
# reasoning: 5 minutes, as long as the frontend waits - and the longest answer a chat model may give, reasoning included
# (a catalog entry's "max output tokens" overrides it; 4096 left thinking models without an answer, October 2026).
app.ai.timeout=300s
app.ai.max-output-tokens=16384
# A tenant answering through its A2A agent (docs/architecture/a2a.md): how long the agent's answer may take - a workflow
# runs longer than a model answers -, and the longest answer kept (longer ones are cut with "...").
app.a2a.timeout=${APP_A2A_TIMEOUT\:10m}
app.a2a.max-answer-chars=${APP_A2A_MAX_ANSWER_CHARS\:200000}
# The tenants' assistant as an A2A agent: how long an answered question kept as a task (a streamed one, or asked with
# returnImmediately) stays for its key - empty keeps it. The cleanup runs hourly over the tenants with such tasks.
app.a2a.task-retention-hours=${APP_A2A_TASK_RETENTION_HOURS\:24}
# Own model servers (OLLAMA, OPENAI_COMPATIBLE, ...) are reached over HTTPS only - except the hosts named here, comma
# separated (e.g. "ollama,10.0.0.5": a server in the same pod or the internal network). Empty: none.
app.ai.plain-http-hosts=${APP_AI_PLAIN_HTTP_HOSTS\:}
# The web search's address (services.tools.TavilySearch): empty is Tavily's own. Another address answering like Tavily -
# only for a test stack's fake (devtools/tavily-fake); the tenant's Tavily key goes there too.
app.web-search.address=${APP_WEB_SEARCH_ADDRESS\:}
# The tenants' file stores (SFTP, FTPS - services.filestore) may lie in an internal network only on the hosts named
# here, comma separated (e.g. "logs.intern,10.0.5.20"); every tenant admin may enter them. Empty: public hosts only.
app.file-store.internal-hosts=${APP_FILE_STORE_INTERNAL_HOSTS\:}
# Text files sent with a question answered once (/api/v1/chat of an API key without history, the MCP server's
# ask_assistant - services.chat.SentFiles): at most max-text characters together; up to inline-text they go with the
# question whole, larger ones as an overview the model reads through search_file and read_file_lines - at most
# search-results matching lines, read-lines lines and tool-text characters per call, in up to rounds rounds.
app.chat.sent-files.max-text=${APP_CHAT_SENT_FILES_MAX_TEXT\:10000000}
app.chat.sent-files.inline-text=${APP_CHAT_SENT_FILES_INLINE_TEXT\:500000}
app.chat.sent-files.search-results=${APP_CHAT_SENT_FILES_SEARCH_RESULTS\:200}
app.chat.sent-files.read-lines=${APP_CHAT_SENT_FILES_READ_LINES\:500}
app.chat.sent-files.tool-text=${APP_CHAT_SENT_FILES_TOOL_TEXT\:40000}
app.chat.sent-files.rounds=${APP_CHAT_SENT_FILES_ROUNDS\:12}
# Videos in the chat (docs/architecture/code-execution.md "Videos"): examined with code in the tenant's sandbox - a tenant
# without one gets a video refused. One may have video-max-size (raise micronaut.server.max-request-size and
# multipart.max-file-size with it, and the sandbox's /work and SANDBOX_FILE_MB); every other file stays at 50 MB.
app.chat.video-max-size=${APP_CHAT_VIDEO_MAX_SIZE\:500MB}
# Rounds of an answer about a video (probe, overview, frames, look, search, draw, check, hand out) - every round sends
# the frames looked at again, so only an answer with a video in its conversation and the code tools gets them.
app.chat.video-rounds=${APP_CHAT_VIDEO_ROUNDS\:16}
# How long the chat's files stay in the storage (services.chat.ChatFileCleanupJob, running at cleanup-cron - every hour):
# an uploaded video video-retention-hours after its upload, every other file file-retention-days after it was stored.
# Left empty, a retention is off and those files are kept until they or their conversation are deleted.
app.chat.video-retention-hours=${APP_CHAT_VIDEO_RETENTION_HOURS\:8}
app.chat.file-retention-days=${APP_CHAT_FILE_RETENTION_DAYS\:14}
app.chat.cleanup-cron=${APP_CHAT_CLEANUP_CRON\:0 0 * * * *}
# The sandboxes the chat's Python and shell run in (services.sandbox.Sandboxes, docs/architecture/code-execution.md):
# every tenant has instances of its own - the admin enters their addresses and token at the tenant; without them the
# tenant's chat runs no code. A call may take up to timeout (the sandbox stops code after 300 seconds - a pass over a
# video -, SANDBOX_TIMEOUT_SECONDS); an answer waits up to wait for a free instance of its tenant, then the model goes on
# without.
app.sandbox.timeout=${APP_SANDBOX_TIMEOUT\:330s}
app.sandbox.wait=${APP_SANDBOX_WAIT\:15s}
# ffmpeg converts uploaded audio into the small copy a model is sent (services.chat.MediaConverter): the container
# image has it; locally it comes from the PATH. A conversion taking longer than the timeout is refused.
app.media.ffmpeg=${APP_MEDIA_FFMPEG\:ffmpeg}
app.media.timeout=10m
# The daily report (services.monitoring.DailyReportJob, docs/architecture/monitoring.md) to mail-to (comma separated) at
# this time in app.timezone - always, also when everything is fine: a missing one means the process or the mail server
# is down. Its own scheduler, so a slow mail server holds up nothing else. Without recipients or a mail host nothing is sent.
app.monitoring.mail-to=${APP_MONITORING_MAIL_TO\:}
app.monitoring.daily-report-cron=${APP_MONITORING_DAILY_REPORT_CRON\:0 0 6 * * *}
micronaut.executors.monitoring.type=scheduled
micronaut.executors.monitoring.core-pool-size=1
# SMTP server for the e-mails (mail.MailSender); without a host no mail is sent. security: STARTTLS (port 587), SSL
# (port 465) or NONE. from: the sender address, by default the username.
app.mail.host=${APP_MAIL_HOST\:}
app.mail.port=${APP_MAIL_PORT\:587}
app.mail.security=${APP_MAIL_SECURITY\:STARTTLS}
app.mail.username=${APP_MAIL_USERNAME\:}
app.mail.password=${APP_MAIL_PASSWORD\:}
app.mail.from=${APP_MAIL_FROM\:}
# Documents are embedded in the background on these threads (services.document.DocumentIndexer).
micronaut.executors.indexing.type=fixed
micronaut.executors.indexing.n-threads=2
# Knowledge sources (services.document.SourceSync, docs/architecture/knowledge-sources.md): their runs list a file
# store's folder and read its files on these threads - a slow store holds neither the tasks nor the indexing.
micronaut.executors.sources.type=fixed
micronaut.executors.sources.n-threads=2
# Scheduled tasks (services.task, docs/architecture/tasks.md): their runs go on these threads - a run waits (QUEUED)
# while all are busy; an agent or verify step may take this many rounds of its model.
micronaut.executors.task.type=fixed
micronaut.executors.task.n-threads=2
app.task.agent-rounds=8
# How long the MCP server's run_task waits for a run's end before it answers with the run's id.
app.task.mcp-wait=60s
# "Draft with AI": at most three rounds of the model with the check, and no new round after this long - the editor
# waits 6 minutes for an answer.
app.task.draft-timeout=5m
# How long a run stays with the lines its steps read (services.task.TaskRunCleanupJob, every hour): deleted this many
# days after it ended. Left empty, runs are kept until a tenant admin deletes them or their task.
app.task.run-retention-days=${APP_TASK_RUN_RETENTION_DAYS\:14}
# How the chat searches the company knowledge (services.document.KnowledgeSearch, docs/architecture/ai-features.md
# "Search"): HYBRID (vectors and full text), VECTOR, FULL_TEXT or LANGCHAIN4J_HYBRID; and how much the full text counts
# in HYBRID, the vectors counting 1. Measured with RetrievalEvaluationSpec - change them only after measuring again.
app.search.mode=${APP_SEARCH_MODE\:HYBRID}
app.search.text-weight=${APP_SEARCH_TEXT_WEIGHT\:0.3}
# How many of the search's candidates a tenant's reranker reorders (2 to 40, docs/architecture/ai-features.md
# "Reranking"). 10 for a reranker on a CPU (about a second per candidate): measured almost the whole gain of all 40
# (first hit 82 % instead of 85 %) within the 30 seconds the search waits. With a GPU: 20 - measured the whole gain.
app.search.rerank-candidates=${APP_SEARCH_RERANK_CANDIDATES\:10}
# The look of the frontend (docs/architecture/branding.md): the installation's default - the login page, the admin's
# dashboard and every tenant the admin gave no look of its own. The logo is a PNG, JPEG or WebP file of at most
# 512 KB - a path (e.g. in a volume of the container) or classpath:..., by default the Zirmo logo in the jar;
# empty = no logo. An invalid value stops the start.
app.branding.name=${APP_BRANDING_NAME\:Zirmo}
app.branding.primary-color=${APP_BRANDING_PRIMARY_COLOR\:#49732a}
# (Backticks: the default contains a colon, which a placeholder would otherwise read as one more fallback.)
app.branding.logo=${APP_BRANDING_LOGO\:`classpath\:branding/default-logo.png`}

# The tenant's MCP server for Claude Code (docs/architecture/mcp.md): stateless streamable HTTP at /mcp, the tools are
# services.mcp.AssistantMcpTools. The name is neutral: every tenant's client is answered with the tenant's brand
# (services.mcp.BrandedMcpServer).
micronaut.mcp.server.transport=HTTP
micronaut.mcp.server.endpoint=/mcp
micronaut.mcp.server.info.name=ai-assistant
micronaut.mcp.server.info.version=${app.version}
