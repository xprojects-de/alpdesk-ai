# Local development ("dev" environment: `./gradlew run`, the IDE with MICRONAUT_ENVIRONMENTS=dev).
# The database of Backend/podman/docker-compose.dev.yml, whose data lives in Backend/database/ and survives restarts.
# Start it first (`./gradlew devDbStart`) - without it the backend does not start. Port 15433, not 5432: it
# runs next to a PostgreSQL of the machine or of another project. These values are in the repository and local only; environment
# variables (DATASOURCES_DEFAULT_*) still win.
datasources.default.url=jdbc:postgresql://localhost:15433/alpdesk_ai
datasources.default.username=alpdeskai
datasources.default.password=local-db-password
# The sandbox for the chat's Python and shell belongs to a tenant: `./gradlew sandboxStart` (or `videoSandboxStart`
# for the video image) starts one on
# 127.0.0.1:19180 (Backend/podman/docker-compose.sandbox.yml) - enter http://localhost:19180 and its local token at a
# test tenant (page "Mandanten"). Not running: the tools are not offered, nothing else changes.
# The daily report goes to a local MailHog: SMTP on 127.0.0.1:1025, its web UI on http://localhost:8025 - MailHog's
# own ports, so one MailHog serves several projects. Start it yourself, e.g. `podman run -d --name mailhog
# -p 1025:1025 -p 8025:8025 docker.io/mailhog/mailhog`. Without it a report fails with a warning in the log (and "Send
# daily report now" answers the refusal), nothing else. APP_MAIL_* and APP_MONITORING_MAIL_TO still win.
app.mail.host=127.0.0.1
app.mail.port=1025
app.mail.security=NONE
app.mail.from=alpdesk-ai@example.com
app.monitoring.mail-to=dev@example.com
