<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>
  table, td, p, span, li { font-family: Arial, sans-serif !important; }
  .mono { font-family: Consolas, 'Courier New', monospace !important; }
</style>
<![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f6" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <!--[if mso]><table role="presentation" width="760" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:760px;">
        <tr>
          <td bgcolor="{{brand}}" style="background-color:{{brand}};padding:20px 24px;border-radius:8px 8px 0 0;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:12px;line-height:16px;letter-spacing:1px;text-transform:uppercase;color:#ffffff;">{{installation}}</p>
            <p style="margin:4px 0 0 0;font-size:22px;line-height:28px;font-weight:bold;color:#ffffff;">{{title}}</p>
          </td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff;padding:20px 24px;border-bottom:1px solid #e5e7eb;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#111827;">
            {{summary}}
          </td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" style="background-color:#ffffff;padding:0 24px 24px 24px;border-radius:0 0 8px 8px;">
            {{content}}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;font-family:Roboto,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#6b7280;">
            {{footer}}
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
