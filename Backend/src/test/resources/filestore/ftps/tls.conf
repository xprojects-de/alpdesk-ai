LoadModule mod_tls.c
ServerName "check"
DefaultRoot ~
UseIPv6 off
# Passive ports published 1:1 by the spec - the address it names does not matter: our client always connects the data
# connection to the control connection's host.
PassivePorts 39400 39404
MasqueradeAddress 127.0.0.1
<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/proftpd/cert.pem
  TLSRSACertificateKeyFile /etc/proftpd/key.pem
  TLSVerifyClient off
</IfModule>
