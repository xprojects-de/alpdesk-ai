# The tests have their own PostgreSQL container (with pgvector, like production), started by the Testcontainers JDBC
# driver on the first connection and kept for the whole test JVM (TC_DAEMON), so specs never write into the dev
# database of `./gradlew run` (application-dev.properties). "pgvectortest" is the pgvector container with more shared
# memory and more connections (services.tenant.TestDatabaseProvider): the ~1000 tenant databases of a run outgrow a
# container's 64 MB, and the tenants of a quick spec's features PostgreSQL's 100 connections.
datasources.default.url=jdbc:tc:pgvectortest:pg18:///alpdesk_ai_test?TC_DAEMON=true
datasources.default.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
datasources.default.username=test
datasources.default.password=test
# No migration of every tenant database on each context's start (services.tenant.TenantDatabaseMigration): the specs
# never delete their tenants, ~1000 pile up in the container over a run, and every spec class's start would migrate all
# of them again - three quarters of the suite's time. Each was migrated when it was created. TenantDatabasesSpec and
# CapacitySpec switch it on.
app.tenant-databases.migrate-on-start=false
# Test files go below build/, emptied before every run (build.gradle).
app.storage.local.path=build/test-storage
# Random port, so specs never collide with each other or with a locally running backend on 19100.
micronaut.server.port=-1
# Bound to 127.0.0.1, not all addresses: on macOS a server on all addresses can share a port with a
# program listening on 127.0.0.1 only (e.g. Podman's gvproxy SSH forward), and the specs' calls to
# localhost then reach that program. On 127.0.0.1 the bind fails instead and another random port is taken.
micronaut.server.host=127.0.0.1
# Plain HTTP to own model servers only to these hosts (services.ai.ModelServers) - AiModelSpec checks both sides; the
# MCP specs' fake software runs on 127.0.0.1, which the internal-address check refuses unless named here.
app.ai.plain-http-hosts=ollama-intern,127.0.0.1
# Files sent with a question (services.chat.SentFiles): small limits, so the specs reach every one of them with little
# text - the MCP specs' messages name max-text.
app.chat.sent-files.max-text=200000
app.chat.sent-files.inline-text=2000
app.chat.sent-files.search-results=5
app.chat.sent-files.read-lines=10
app.chat.sent-files.tool-text=2000
# A video above the 50 MB of every other file stays testable: ChatVideoSpec uploads one of 55 MB and refuses 61 MB.
app.chat.video-max-size=60MB
# The file store specs' SFTP and FTPS servers run in containers reached on localhost, which the internal-address check
# refuses unless named here (services.filestore.FileStoreAddresses) - FileStoreSpec checks another internal host.
app.file-store.internal-hosts=localhost,127.0.0.1
